<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xem thử khung viết kanji</title>
  <link rel="stylesheet" href="kanji-writer.css">
  <style>
    body { margin: 0; background: #faf9f6; color: #25334a; font-family: system-ui,sans-serif; }
    main { width: min(100% - 40px, 360px); margin: 42px auto; }
    .preview-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #69768b; margin: 0 0 24px; }
    .preview-form { margin-top: 28px; padding-top: 22px; border-top: 1px solid #dfe3e9; }
    label { display: block; font-size: 13px; margin-bottom: 8px; }
    .preview-fields { display: flex; gap: 8px; }
    input { min-width: 0; flex: 1; font: inherit; padding: 10px; border: 1px solid #ccd3dd; border-radius: 8px; }
    .preview-fields button { border: 0; border-radius: 8px; background: #25334a; color: white; padding: 10px 18px; cursor: pointer; }
    .preview-hint { font-size: 12px; color: #69768b; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <p class="preview-label">Bản xem thử · Hướng dẫn viết kanji</p>
    <div id="kanjiPreview"></div>
    <form class="preview-form">
      <label for="previewWord">Thử một từ trong bộ từ vựng</label>
      <div class="preview-fields"><input id="previewWord" value="刻" maxlength="40" autocomplete="off"><button type="submit">Xem</button></div>
      <p class="preview-hint">Ví dụ: 準備, 感じる, 様々. Chỉ các chữ kanji được hướng dẫn. Biểu mẫu này dùng để xem thử, chưa gắn vào các chế độ học.</p>
    </form>
  </main>
  <script src="kanji-writer.js"></script>
  <script>
    const writer = KanjiWriter.mount(document.getElementById('kanjiPreview'), {word: '刻'});
    document.querySelector('form').addEventListener('submit', event => {
      event.preventDefault(); writer.setWord(document.getElementById('previewWord').value.trim());
    });
  </script>
</body>
</html>
